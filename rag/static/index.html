<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local RAG</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --muted:#6d6b65; --line:#e2dfd6; --accent:#1f5f4a; --user:#e7efe9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --panel:#1f211e; --ink:#ecebe6; --muted:#9a988f; --line:#33352f; --accent:#7fc7a8; --user:#26342d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  #stat { color:var(--muted); font-size:13px; flex:1; min-width:180px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; }
  .dot.busy { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  button, select { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink);
           border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  select { max-width:150px; font-size:13px; }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #activity { display:none; border-bottom:1px solid var(--line); background:var(--panel); padding:8px 16px;
              font-size:13px; max-height:32dvh; overflow:auto; }
  #activity.open { display:block; }
  #activity div { color:var(--muted); overflow-wrap:anywhere; }
  #activity b { color:var(--ink); font-weight:600; }
  main { flex:1; overflow:auto; padding:16px; }
  .wrap { max-width:780px; margin:0 auto; }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { background:var(--user); margin-left:15%; }
  .bot { background:var(--panel); border:1px solid var(--line); }
  .err { color:#c0392b; }
  .note { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; white-space:normal; }
  details { margin-top:10px; font-size:13px; color:var(--muted); white-space:normal; }
  details li { margin:8px 0; overflow-wrap:anywhere; }
  details pre { margin:4px 0 0; white-space:pre-wrap; font-size:12px; opacity:.85; }
  .hint { color:var(--muted); text-align:center; margin-top:18dvh; }
  form { padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  form .wrap { display:flex; gap:8px; }
  .steps li { margin:3px 0; }
  .g-correct { color:#1f7a4d; } .g-ambiguous { color:#b7791f; } .g-incorrect { color:#c0392b; }
  .unsup { text-decoration:underline dotted #c0392b; text-decoration-thickness:2px; text-underline-offset:3px; }
  .wrongcite { text-decoration:underline dotted #b7791f; text-underline-offset:3px; }
  .vnote { display:block; font-size:12px; color:var(--muted); margin-top:8px; white-space:normal; }
  .webbtn { margin-top:10px; font-size:13px; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:6px; padding:0 5px; margin-left:4px; }
  textarea { flex:1; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
             border-radius:10px; padding:9px 12px; resize:none; height:44px; }
</style>
</head>
<body>
<header>
  <h1>Local RAG</h1>
  <span id="stat"><span class="dot"></span>connecting…</span>
  <select id="fRoot" aria-label="Folder filter"><option value="">All folders</option></select>
  <select id="fExt" aria-label="File type filter"><option value="">All types</option></select>
  <button id="actBtn" type="button">Activity</button>
  <button id="rescan" type="button">Rescan</button>
  <select id="chats" aria-label="Saved chats"><option value="">Saved chats</option></select>
  <button id="clear" type="button">New chat</button>
  <button id="del" type="button" hidden>Delete</button>
</header>
<div id="activity"></div>
<main><div class="wrap" id="chat"></div></main>
<form id="form"><div class="wrap">
  <textarea id="q" placeholder="Ask about your files…" autofocus></textarea>
  <button class="primary" id="send">Send</button>
</div></form>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat');
let history = [], conversationId = null;
const HINT = 'Ask anything about the files in your allowed folders.\nEdits, new files and deletions are picked up automatically.';

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function reset() { history = []; conversationId = null; $('chats').value = ''; $('del').hidden = true; chat.textContent = ''; const h = el('p', 'hint', HINT); h.style.whiteSpace = 'pre-line'; chat.append(h); }
reset();

let token = '';
try { token = localStorage.getItem('rag_token') || ''; } catch {}
async function api(path, opts = {}) {
  opts.headers = {...(opts.headers || {}), ...(token ? {Authorization: 'Bearer ' + token} : {})};
  let res = await fetch(path, opts);
  if (res.status === 401) {
    token = prompt('Access token (auth_token in config.yaml):') || '';
    try { localStorage.setItem('rag_token', token); } catch {}
    opts.headers.Authorization = 'Bearer ' + token;
    res = await fetch(path, opts);
  }
  return res;
}

function fill(select, values, label, show) {
  const have = [...select.options].slice(1).map(o => o.value).join('|');
  if (have === values.join('|')) return;
  const current = select.value; select.textContent = '';
  select.append(new Option(label, ''));
  for (const v of values) select.append(new Option(show(v), v));
  select.value = values.includes(current) ? current : '';
}

async function refresh() {
  try {
    const s = await (await api('/api/status')).json();
    const stat = $('stat'); stat.textContent = '';
    stat.append(el('span', 'dot' + (s.busy ? ' busy' : '')),
      `${s.files} files · ${s.chunks} chunks · ${s.mode}${s.reranker ? ' + rerank' : ''}` + (s.busy ? ' · indexing…' : ''));
    const failed = s.events.filter(e => e.action === 'error').length;
    if (failed) stat.append(el('span', 'err', ` · ${failed} file${failed > 1 ? 's' : ''} failed to index, see Activity`));
    fill($('fRoot'), s.paths, 'All folders', p => p.split(/[\\/]/).filter(Boolean).pop());
    fill($('fExt'), s.extensions, 'All types', e => e);
    const act = $('activity'); act.textContent = '';
    act.append(el('div', '', 'Allowed paths: ' + s.paths.join(', ')));
    if (!s.events.length) act.append(el('div', '', 'No changes yet.'));
    for (const e of s.events) {
      const row = el('div'); row.append(el('b', '', new Date(e.time * 1000).toLocaleTimeString() + ' ' + e.action + ' '),
        e.path + (e.detail ? ' — ' + e.detail : '')); act.append(row);
    }
  } catch { $('stat').textContent = 'server not reachable'; }
}
setInterval(refresh, 4000); refresh();
$('actBtn').onclick = () => $('activity').classList.toggle('open');
$('rescan').onclick = async () => { await api('/api/rescan', {method:'POST'}); refresh(); };
$('clear').onclick = reset;

function addSources(bot, sources, abstain) {
  if (!sources || !sources.length) return;
  const d = el('details'); d.append(el('summary', '', (abstain ? 'Closest matches' : 'Sources') + ` (${sources.length})`));
  const ul = el('ul');
  for (const s of sources) {
    const li = el('li');
    const b = el('b', '', `[${s.n}] ${s.name}${s.heading && !s.web ? ' › ' + s.heading : ''} `);
    if (s.web) b.append(el('span', 'tag', 'web'));
    if (s.expanded) b.append(el('span', 'tag', '+' + s.expanded + ' nearby'));
    if (s.refined) b.append(el('span', 'tag', 'trimmed ' + s.refined));
    li.append(b, ' ', s.web ? s.path : `${s.path} · score ${s.score}`, el('pre', '', s.preview));
    ul.append(li);
  }
  d.append(ul); bot.append(d);
}

function stepText(s) {
  switch (s.stage) {
    case 'route': return `Plan: ${s.route.replace('_', '-')}` + (s.sub_queries && s.sub_queries.length ? ` → ${s.sub_queries.map(q => '"' + q + '"').join(', ')}` : '') + (s.how === 'llm' ? '' : ` (${s.how})`);
    case 'grade': return `Search "${s.query}": ${s.grade} (best ${s.best}, ${s.found} found)`;
    case 'retry': return `Retry ${s.n}${s.hyde ? ' + HyDE' : ''}: ${s.queries.map(q => '"' + q + '"').join(', ')} → ${s.grade} (best ${s.best})`;
    case 'round': return `Round ${s.n}: missing ${s.missing || '?'} → "${s.query}", ${s.new_chunks} new`;
    case 'sufficient': return `Round ${s.n}: evidence is sufficient`;
    case 'refine': return `Trimmed ${s.dropped} irrelevant sentence group${s.dropped === 1 ? '' : 's'} (kept ${s.kept})`;
    case 'agent': return `Agent: first search was ${s.grade} — deciding what else to look up`;
    case 'tool': return s.tool === 'finish' ? `Agent finished${s.args && s.args.reason ? ': ' + s.args.reason : ''}`
      : `Tool ${s.n}: ${s.tool}(${Object.values(s.args || {}).join(', ')})${s.ok ? '' : ' — refused/failed'}${s.grade ? ' → ' + s.grade : ''}`;
    case 'agent_done': return `Agent: ${s.steps} step${s.steps === 1 ? '' : 's'}, ${s.evidence} source${s.evidence === 1 ? '' : 's'}, overall ${s.grade} (${s.reason})`;
    case 'recheck': return s.new_chunks ? `Self-check: searched for ${s.queries.length} unsupported statement${s.queries.length === 1 ? '' : 's'}, ${s.new_chunks} new source${s.new_chunks === 1 ? '' : 's'}` : 'Self-check: no further sources for the unsupported statements';
    case 'verify': return `Checking the answer against the sources (${s.backend})`;
    case 'fallback': return `Fallback: ${s.reason}`;
    case 'web': return `Web search: "${s.query}"`;
    case 'web_error': return `Web search failed: ${s.detail}`;
    default: return s.stage;
  }
}

function stepsBox(bot) {
  let d = bot.querySelector('details.steps');
  if (!d) {
    d = el('details', 'steps'); d.append(el('summary', '', 'Steps'), el('ul'));
    const first = bot.querySelector('details'); first ? bot.insertBefore(d, first) : bot.append(d);
  }
  return d;
}

function addStep(bot, s) {
  const d = stepsBox(bot), li = el('li', s.grade ? 'g-' + s.grade : '', stepText(s));
  d.querySelector('ul').append(li);
  d.querySelector('summary').textContent = `Steps (${d.querySelectorAll('li').length})`;
}

function showVerification(text, bot, v) {
  if (!v || !v.segments) return;
  text.textContent = '';
  for (const seg of v.segments) {
    const span = el('span', seg.s === false ? 'unsup' : (seg.fix ? 'wrongcite' : ''), seg.t);
    if (seg.s === false) span.title = 'Not supported by the sources';
    else if (seg.fix) span.title = 'Supported by ' + (seg.fix.length ? seg.fix.map(n => '[' + n + ']').join(' ') : 'other sources') + ', not the cited one';
    text.append(span);
  }
  bot.querySelector('.vnote')?.remove();
  const parts = [`Checked ${v.checked} sentence${v.checked === 1 ? '' : 's'}`];
  parts.push(v.unsupported ? `${v.unsupported} not supported by the sources (underlined)` : 'all supported by the sources');
  if (v.citation_errors) parts.push(`${v.citation_errors} cite the wrong source`);
  const note = el('span', 'vnote', parts.join(' · '));
  const after = bot.querySelector('details'); after ? bot.insertBefore(note, after) : bot.append(note);
}

async function loadChats() {
  try {
    const list = await (await api('/api/conversations')).json();
    const sel = $('chats'); sel.textContent = '';
    sel.append(new Option('Saved chats', ''));
    for (const c of list) sel.append(new Option(c.title, c.id));
    sel.value = conversationId || '';
    sel.hidden = !list.length;
  } catch {}
}
loadChats();

$('chats').onchange = async () => {
  const id = $('chats').value;
  if (!id) return reset();
  const res = await api('/api/conversations/' + id);
  if (!res.ok) { reset(); return loadChats(); }
  const messages = await res.json();
  reset(); chat.textContent = '';
  conversationId = id; $('chats').value = id; $('del').hidden = false;
  for (const m of messages) {
    const box = el('div', 'msg ' + (m.role === 'user' ? 'user' : 'bot'));
    const span = el('span', '', m.content); box.append(span);
    if (m.role !== 'user') {
      for (const st of m.steps || []) addStep(box, st);
      addSources(box, m.sources, m.abstain);
      if (m.verification) showVerification(span, box, m.verification);
    }
    chat.append(box);
    history.push({role: m.role, content: m.content});
  }
  chat.lastChild?.scrollIntoView({block: 'end'});
};

$('del').onclick = async () => {
  if (!conversationId) return;
  await api('/api/conversations/' + conversationId, {method: 'DELETE'});
  reset(); loadChats();
};

$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const question = $('q').value.trim(); if (!question) return;
  $('q').value = '';
  ask(question);
});

async function ask(question, webQuery) {
  chat.querySelector('.hint')?.remove();
  $('send').disabled = true;
  chat.append(el('div', 'msg user', webQuery ? `${question}\n(search the web for: ${webQuery})` : question));
  const bot = el('div', 'msg bot'), text = el('span', '', '…'); bot.append(text); chat.append(bot);
  bot.scrollIntoView({block: 'end'});
  let answer = '', sources = [], abstain = false, offer = null, verification = null;
  const filters = {roots: $('fRoot').value ? [$('fRoot').value] : [], exts: $('fExt').value ? [$('fExt').value] : []};
  try {
    const body = {question, history, filters, conversation_id: conversationId};
    if (webQuery) body.web_query = webQuery;
    const res = await api('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!res.ok) {
      let detail = ''; try { detail = (await res.json()).error || ''; } catch {}
      throw new Error('Request failed (' + res.status + ')' + (detail ? ': ' + detail : ''));
    }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {done, value} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const m = JSON.parse(line);
        if (m.type === 'conversation') { conversationId = m.id; $('del').hidden = false; }
        else if (m.type === 'step') addStep(bot, m);
        else if (m.type === 'sources') {
          sources = m.sources; abstain = m.abstain;
          if (m.query && m.query !== question && !webQuery) bot.prepend(el('span', 'note', 'Searched for: ' + m.query));
        }
        else if (m.type === 'token') { answer += m.text; text.textContent = answer; }
        else if (m.type === 'revision') {
          answer = m.text; text.textContent = answer;
          bot.prepend(el('span', 'note', 'Rewritten after the first draft had unsupported statements.'));
        }
        else if (m.type === 'verification') { verification = m; showVerification(text, bot, m); }
        else if (m.type === 'web_offer') offer = m.query;
        else if (m.type === 'error') { text.className = 'err'; text.textContent = m.text; }
      }
      bot.scrollIntoView({block: 'end'});
    }
  } catch (err) { text.className = 'err'; text.textContent = String(err); }
  addSources(bot, sources, abstain);
  if (offer) {
    const btn = el('button', 'webbtn', `Search the web for: "${offer}"`);
    btn.type = 'button';
    btn.title = 'Sends this exact text to your SearXNG instance';
    btn.onclick = () => { btn.disabled = true; ask(question, offer); };
    bot.append(btn);
  }
  if (answer) history.push({role:'user', content: question}, {role:'assistant', content: answer});
  loadChats();
  $('send').disabled = false; $('q').focus();
}
</script>
</body>
</html>
